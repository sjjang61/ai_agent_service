[project]
name = "ai-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  # Web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  # Agent Frameworks
  "agno>=1.0",
  "langchain>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.2",
  "langchain-google-genai>=2.0",
  "langgraph>=0.2",
  # MCP
  "mcp>=1.0",
  # LLM Providers
  "anthropic>=0.40",
  "openai>=1.50",
  "google-generativeai>=0.8",
  # Database
  "sqlalchemy[asyncio]>=2.0",
  "aiomysql>=0.2",
  "alembic>=1.13",
  "redis[hiredis]>=5.0",
  # Auth
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.0",
  # Tools
  "playwright>=1.47",
  "tavily-python>=0.3",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  # Task Queue
  "celery>=5.4",
  "flower>=2.0",
  # Container
  "docker>=7.0",
  # Settings
  "pydantic-settings>=2.5",
  "pydantic[email]>=2.0",
  # Crypto (for env var encryption)
  "cryptography>=42.0",
  "minio>=7.2",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
