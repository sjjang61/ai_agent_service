events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:8500;
    }

    upstream frontend {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 60M;  # 첨부 파일 업로드(UPLOAD_MAX_MB=50) + multipart 오버헤드

        # WebSocket proxy
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Drive 파일 업로드/다운로드: 큰 파일(DRIVE_MAX_FILE_MB=200)이 프록시에서 끊기지 않도록 한도를 키우고 버퍼링하지 않는다.
        # client_max_body_size 는 DRIVE_MAX_FILE_MB 보다 크게 유지할 것
        location /api/drive/files {
            client_max_body_size 210M;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600;
            proxy_send_timeout 600;
        }

        # API proxy
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300;
        }

        # Health check
        location /health {
            proxy_pass http://backend;
        }

        # Frontend (dev HMR)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
