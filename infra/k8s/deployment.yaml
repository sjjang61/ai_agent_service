apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-backend
  labels:
    app: ai-agent-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-agent-backend
  template:
    metadata:
      labels:
        app: ai-agent-backend
    spec:
      containers:
        - name: backend
          image: ai-agent-backend:latest
          ports:
            - containerPort: 8500
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-url
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: anthropic-api-key
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8500
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-celery
  labels:
    app: ai-agent-celery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent-celery
  template:
    metadata:
      labels:
        app: ai-agent-celery
    spec:
      containers:
        - name: celery
          image: ai-agent-backend:latest
          command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "125m"
            limits:
              memory: "512Mi"
              cpu: "500m"
