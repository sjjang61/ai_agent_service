apiVersion: v1
kind: Service
metadata:
  name: ai-agent-backend
spec:
  selector:
    app: ai-agent-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8500
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-agent-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: ai-agent-backend
                port:
                  number: 80
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: ai-agent-backend
                port:
                  number: 80
